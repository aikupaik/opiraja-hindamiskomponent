# Host-Nginx site fragment for the restricted self-signed HTTPS phase.
# Target VM public IPv4: 193.40.157.124
# Install as /etc/nginx/sites-available/opiraja.conf and enable only after
# Compose publishes the web service on 127.0.0.1:8080:8080.
# This file is included from the host's http {} context.

log_format opiraja '$remote_addr [$time_iso8601] '
                   '"$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent request_id=$request_id '
                   'request_time=$request_time '
                   'upstream_status=$upstream_status '
                   'upstream_time=$upstream_response_time '
                   'limit_req_status=$limit_req_status '
                   'limit_conn_status=$limit_conn_status';
access_log /var/log/nginx/opiraja_access.log opiraja;
error_log /var/log/nginx/opiraja_error.log warn;

# Keep the limiter state in shared memory so all host-Nginx workers enforce
# the same per-client limits.
limit_req_zone $binary_remote_addr zone=opiraja_api_rate:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=opiraja_admin_login_rate:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=opiraja_issuance_rate:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=opiraja_player_rate:1m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=opiraja_admin_sse_connections:1m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# The first Phase 2 deployment observes limiter behavior before enforcement.
# Disable both directives after the reviewed dry-run period and controlled
# tests have confirmed that normal workflows do not trigger false positives.
limit_req_dry_run off;
limit_conn_dry_run off;

server_tokens off;
client_max_body_size 11m;
client_header_timeout 10s;
client_body_timeout 30s;
keepalive_timeout 30s;
send_timeout 60s;

ssl_session_cache shared:opiraja_tls:10m;
ssl_session_timeout 10m;

# Reject unknown HTTP Host values rather than redirecting them.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Redirect only the exact VM-IP host and preserve path and query string.
server {
    listen 80;
    server_name 193.40.157.124;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-ID $request_id always;
    return 308 https://193.40.157.124$request_uri;
}

# TLS catch-all: complete the handshake with the temporary certificate,
# then reject unknown Host/SNI values.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/tls/opiraja/self-signed.crt;
    ssl_certificate_key /etc/nginx/tls/opiraja/self-signed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    server_name 193.40.157.124;

    ssl_certificate /etc/nginx/tls/opiraja/self-signed.crt;
    ssl_certificate_key /etc/nginx/tls/opiraja/self-signed.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The public edge owns the canonical browser-security headers. Hide the
    # same headers from the inner proxy so responses contain one copy each.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Request-ID;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Request-ID $request_id always;

    # Limiter responses are generated at the public edge and do not expose
    # the inner proxy's response format or implementation details.
    error_page 429 = @opiraja_rate_limited;

    location @opiraja_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"rate_limited"}';
    }

    # Public edge proxy: replace all client-supplied forwarding metadata.
    location ~ ^/api/v1/admin/experiments/[0-9a-fA-F-]+/events$ {
        limit_conn opiraja_admin_sse_connections 2;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3700s;
    }

    location = /api/v1/admin/login {
        limit_req zone=opiraja_admin_login_rate burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }

    location = /api/v1/tests {
        limit_req zone=opiraja_issuance_rate burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }

    location ~ ^/api/v1/tests/[0-9a-fA-F-]+/player-token$ {
        limit_req zone=opiraja_issuance_rate burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }

    location ~ ^/api/v1/player/tests/[0-9a-fA-F-]+/(start|answers)$ {
        limit_req zone=opiraja_player_rate burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }

    location /api/ {
        limit_req zone=opiraja_api_rate burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }

    # These routes are internal or diagnostic-only and are never exposed
    # through the public browser endpoint.
    location = /nginx-health { return 404; }
    location = /health { return 404; }
    location ^~ /health/ { return 404; }
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /test { return 404; }

    # The learner SPA is deliberately available only below /test/.  It remains
    # same-origin behind this TLS edge; the player container has no host port.
    location ^~ /test/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }
    location = /__docs__ { return 404; }
    location ^~ /__docs__/ { return 404; }
    location = /plumber { return 404; }
    location ^~ /plumber/ { return 404; }
    location = /r { return 404; }
    location ^~ /r/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_send_timeout 60s;
        proxy_read_timeout 65s;
    }
}
