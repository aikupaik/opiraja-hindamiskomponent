worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compress the large immutable bundles before they reach the public
    # host-Nginx proxy and the downstream client. The MIME types are kept
    # narrow so API and other responses are not compressed accidentally.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript text/css;

    log_format main '$remote_addr [$time_iso8601] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent request_id=$request_id '
                    'request_time=$request_time upstream_time=$upstream_response_time';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    client_max_body_size 11m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 60s;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # The host Nginx is the only public entry point.  Accept its exact
    # forwarded scheme and use HTTP for direct container health checks.
    map $http_x_forwarded_proto $opiraja_forwarded_proto {
        default http;
        https https;
    }

    map $http_x_real_ip $opiraja_client_ip {
        default $http_x_real_ip;
        "" $remote_addr;
    }

    upstream api_backend {
        zone api_backend 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    upstream player_frontend {
        zone player_frontend 64k;
        server player:8080 resolve;
        keepalive 8;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /nginx-health {
            allow 127.0.0.1;
            allow ::1;
            allow 172.30.0.1;
            deny all;
            access_log off;
            empty_gif;
        }

        location ~ ^/api/v1/admin/experiments/[0-9a-fA-F-]+/events$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $opiraja_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $opiraja_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3700s;
        }

        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $opiraja_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $opiraja_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 65s;
        }

        location = /health/live {
            access_log off;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $opiraja_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $opiraja_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        location = /health/ready {
            access_log off;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $opiraja_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $opiraja_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 2s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        location ^~ /health/ {
            return 404;
        }

        location = /test {
            return 404;
        }

        location ^~ /test/ {
            proxy_pass http://player_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $opiraja_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $opiraja_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        location = /docs {
            return 404;
        }

        location ^~ /docs/ {
            return 404;
        }

        location = /redoc {
            return 404;
        }

        location = /openapi.json {
            return 404;
        }

        # Never let SPA fallback make common secret/configuration probes look
        # successful. These paths must remain unavailable even if a future
        # build accidentally contains a similarly named file.
        location ~* (^|/)\.(?!well-known(?:/|$)) {
            return 404;
        }

        location ~* (^|/)(terraform\.tfstate(?:\..*)?|appsettings\.json|(?:phpinfo|info)\.php)$ {
            return 404;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /index.html {
            expires -1;
            try_files $uri =404;
        }

        location / {
            # Admin navigation is hash-based, so unknown URL paths are not
            # application routes and must not receive the SPA shell.
            try_files $uri $uri/ =404;
        }
    }
}
