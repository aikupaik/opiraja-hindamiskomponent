# Compose overlay for internal component tests on the pilot VM.
#
# Use only together with the repository root compose.yaml and only during an
# approved test window. Docker publishes these ports on VM loopback, never on
# the public interface. A remote generator reaches them through explicitly
# created SSH tunnels. Stop the overlay and verify the listeners are gone after
# each component test.
services:
  api-perf:
    profiles:
      - api-only
    image: opiraja-assessment-api-perf:local
    build:
      context: .
      dockerfile: backend/Dockerfile.performance
      args:
        API_BASE_IMAGE: ${PERF_API_BASE_IMAGE:-opiraja-assessment-api:local}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - path: ./.env
        required: true
    environment:
      ADMIN_ACCESS_KEY: api-only-admin-disabled
      ALLOWED_HOSTS: '["127.0.0.1"]'
      API_JWT_SECRET: api-only-player-secret-0000000000000000000000000000
      OR_JWT_MAX_LIFETIME_SECONDS: ${PERF_API_OR_JWT_MAX_LIFETIME_SECONDS:-1200}
      PLAYER_APP_URL: http://127.0.0.1:5173
      R_SERVICE_URL: http://127.0.0.1:9
      SUPABASE_SERVICE_KEY: unused-api-only-service-key
      SUPABASE_URL: http://127.0.0.1:9
      PERF_RUN_ID: ${PERF_RUN_ID:-}
      PERF_API_WORKLOAD: ${PERF_API_WORKLOAD:-smoke}
      PERF_API_SHAPE: ${PERF_API_SHAPE:-all}
      PERF_API_FIXTURE_DIR: /performance/fixtures/r
      PERF_API_EVIDENCE_PATH: /evidence/api-only-state.json
    ports:
      - "127.0.0.1:${PERF_API_ONLY_LOOPBACK_PORT:-18002}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health/ready",
              timeout=3,
          ).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - api-performance
    volumes:
      - type: bind
        source: ./performance/results/${PERF_RUN_ID:-_missing}/api-only
        target: /evidence
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    stop_grace_period: 30s

  api:
    ports:
      - "127.0.0.1:${PERF_API_LOOPBACK_PORT:-18000}:8000"

  r-service:
    ports:
      - "127.0.0.1:${PERF_R_LOOPBACK_PORT:-18001}:8000"
    # The normal compute-only attachment is internal and therefore has no
    # gateway through which Docker can publish a host port. Temporarily give R
    # the same NAT-capable gateway used by API. The root-only cleanup in the
    # runbook recreates R without this edge attachment.
    networks:
      compute: {}
      edge:
        gw_priority: 1

networks:
  api-performance:
