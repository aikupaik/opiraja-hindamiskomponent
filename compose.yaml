name: opiraja-assessment

services:
  web:
    image: opiraja-assessment-web:local
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_started
      player:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8080/nginx-health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 10s

  player:
    image: opiraja-assessment-player:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - http://127.0.0.1:8080/nginx-health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 10s

  api:
    image: opiraja-assessment-api:local
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    env_file:
      - path: ./.env
        required: true
    environment:
      R_SERVICE_URL: http://r-service:8000
      FORWARDED_ALLOW_IPS: 172.30.0.0/24
      APP_LOG_LEVEL: '${APP_LOG_LEVEL:-INFO}'
      # Keep the public host identity deployment-specific. The value is a JSON
      # array because Pydantic parses it as list[str] inside the API container.
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:?set ALLOWED_HOSTS to a JSON array of exact deployment hosts}'
    expose:
      - "8000"
    depends_on:
      r-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:8000/health/ready",
              timeout=3,
          ).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      edge:
        gw_priority: 1
      compute: {}
    labels:
      com.opiraja.logs.enabled: "true"
      com.opiraja.logs.service: "api"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s

  r-service:
    image: opiraja-assessment-r-service:local
    build:
      context: ./R
    environment:
      APP_LOG_LEVEL: '${APP_LOG_LEVEL:-INFO}'
      RENV_PATHS_ROOT: /tmp/renv
      RENV_PATHS_SANDBOX: /tmp/renv/sandbox
      RENV_CONFIG_CACHE_ENABLED: "false"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m,mode=1777
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "3"
        - --output
        - /dev/null
        - http://127.0.0.1:8000/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - compute
    labels:
      com.opiraja.logs.enabled: "true"
      com.opiraja.logs.service: "r-service"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - ${LOKI_DATA_DIR:-./.runtime/observability/loki}:/var/lib/loki
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -health
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    user: "0:0"
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=127.0.0.1:12345
      - --server.http.enable-pprof=false
      - --server.http.disable-support-bundle
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # A read-only bind does not make the Docker API read-only. Alloy is the
      # only service granted this host-root-equivalent socket access.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the parent because the image's capability-free root process
      # cannot traverse its alloy:alloy mode-0770 parent to reach a child bind.
      - ${ALLOY_DATA_DIR:-./.runtime/observability/alloy}:/var/lib/alloy
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/alloy
        - fmt
        - --test
        - /etc/alloy/config.alloy
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - observability
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    user: "472:0"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      GF_SERVER_ROOT_URL: '${GRAFANA_ROOT_URL:-https://193.40.157.124/grafana/}'
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana-secret-key
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PLUGIN_ADMIN_EXTERNAL_MANAGE_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
      GF_EXPLORE_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_SMTP_ENABLED: "false"
      GF_LOG_MODE: console
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${GRAFANA_DATA_DIR:-./.runtime/observability/grafana}:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    secrets:
      - source: grafana_admin_password
        target: grafana-admin-password
      - source: grafana_secret_key
        target: grafana-secret-key
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - observability
      - grafana-host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s

secrets:
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./.runtime/observability/secrets/grafana-admin-password}
  grafana_secret_key:
    file: ${GRAFANA_SECRET_KEY_FILE:-./.runtime/observability/secrets/grafana-secret-key}

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  compute:
    driver: bridge
    internal: true
  observability:
    driver: bridge
    internal: true
  grafana-host:
    driver: bridge
